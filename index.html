<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff0a8">
  <title>Poo Poo Cat</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Courier New", monospace;
      background: #fff0a8;
      color: #59402e;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background:
        radial-gradient(circle at 1px 1px, #f8d879 1px, transparent 1.5px) 0 0 / 16px 16px,
        #fff0a8;
    }
    main { width: min(100%, 980px); text-align: center; }
    h1 {
      margin: 0 0 10px;
      color: #a96716;
      font-size: clamp(24px, 5vw, 38px);
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 4px 5px 0 #704526;
    }
    .frame {
      padding: 10px;
      border: 5px solid #fff9d8;
      border-radius: 12px;
      background: #8d5d35;
      box-shadow: 0 8px 0 #684127, 0 12px 24px #785a3255;
    }
    canvas {
      width: 100%;
      height: auto;
      aspect-ratio: 8 / 5;
      display: block;
      border: 3px solid #654529;
      background: #fff0b5;
      image-rendering: pixelated;
      touch-action: none;
      cursor: pointer;
    }
    .hint { margin: 16px 4px 0; font-size: clamp(12px, 2vw, 15px); line-height: 1.5; }
    .hint strong { color: #93531c; }
  </style>
</head>
<body>
  <main>
    <h1>POO POO CAT</h1>
    <div class="frame"><canvas id="game" width="480" height="300" aria-label="Poo Poo Cat pixel-art game"></canvas></div>
    <p class="hint" id="hint"><strong>Click Start</strong> or press <strong>Space</strong> · Choose a food · Hold <strong>Push!</strong> and release in the green zone</p>
  </main>
  <script>
    (() => {
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const hint = document.querySelector("#hint");
      const W = canvas.width, H = canvas.height;
      const foodModes = {
        rice: { name: "Rice", label: "EASY MODE", time: 6, color: "#68402c", kind: "classic" },
        corn: { name: "Corn", label: "HARD MODE", time: 10.43, color: "#242127", kind: "corn" },
        beet: { name: "Beetroot", label: "NORMAL MODE", time: 4.5, color: "#c53654", kind: "beet" },
        dragon: { name: "Dragon Fruit", label: "EXPERT MODE", time: 3.14, color: "#f0d743", kind: "dragon" }
      };
      let scene = "title";
      let food = foodModes.rice;
      let progress = 0;
      let pushStartedAt = 0;
      let pushAccumulated = 0;
      let lastPushAt = 0;
      let pushing = false;
      let pushExpired = false;
      let result = "";
      let sceneStartedAt = performance.now();
      let audioContext;
      let lastFrame = 0;
      const buttons = {
        start: { x: 176, y: 242, w: 128, h: 38 },
        push: { x: 161, y: 244, w: 130, h: 40 },
        restart: { x: 355, y: 246, w: 112, h: 38 }
      };

      function sound(kind) {
        try {
          audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
          if (audioContext.state === "suspended") audioContext.resume();
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();
          osc.connect(gain); gain.connect(audioContext.destination);
          const now = audioContext.currentTime;
          osc.type = kind === "flush" ? "sawtooth" : "square";
          osc.frequency.setValueAtTime(kind === "flush" ? 280 : 760, now);
          osc.frequency.exponentialRampToValueAtTime(kind === "flush" ? 95 : 390, now + (kind === "flush" ? .55 : .08));
          gain.gain.setValueAtTime(.055, now);
          gain.gain.exponentialRampToValueAtTime(.001, now + (kind === "flush" ? .58 : .09));
          osc.start(now); osc.stop(now + (kind === "flush" ? .6 : .1));
        } catch (_) {}
      }

      function box(x, y, w, h, color, stroke) {
        ctx.fillStyle = color; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
        if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.strokeRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
      }
      function pixelText(text, x, y, size = 10, color = "#59402e", align = "center", outline = null) {
        ctx.save(); ctx.font = `bold ${size}px "Courier New", monospace`; ctx.textAlign = align; ctx.textBaseline = "middle";
        if (outline) { ctx.lineWidth = 3; ctx.strokeStyle = outline; ctx.strokeText(text, x, y); }
        ctx.fillStyle = color; ctx.fillText(text, x, y); ctx.restore();
      }
      function button(rect, label, active = false) {
        box(rect.x, rect.y + 4, rect.w, rect.h, "#94601f");
        box(rect.x, rect.y, rect.w, rect.h, active ? "#f5bd43" : "#ffd766", "#fff4bf");
        box(rect.x + 5, rect.y + 4, rect.w - 10, 3, "#fff1b1");
        pixelText(label, rect.x + rect.w / 2, rect.y + rect.h / 2 + 1, 15, "#80501e");
      }
      function sparkle(x, y, color = "#fffbe1", phase = 0) {
        const s = 2 + (Math.sin(phase) + 1);
        box(x - s / 2, y - 1, s, 2, color); box(x - 1, y - s / 2, 2, s, color);
      }
      function cat(x, y, scale = 1, tired = false, pose = "sit") {
        ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
        const gold = tired ? "#d9b866" : "#f7c84c";
        const shade = tired ? "#aa925c" : "#d99b2e";
        const bob = pose === "dance" ? Math.sin(performance.now() / 90) * 3 : 0;
        ctx.translate(0, bob);
        // Wings
        box(-27, -35, 12, 21, "#fff"); box(-32, -31, 7, 11, "#fff"); box(15, -35, 12, 21, "#fff"); box(25, -31, 7, 11, "#fff");
        box(-26, -18, 8, 5, "#e5e3d6"); box(18, -18, 8, 5, "#e5e3d6");
        // Tail and body
        box(18, 13, 14, 7, gold); box(27, 8, 7, 10, gold);
        box(-21, -2, 42, 37, gold); box(-17, 26, 13, 8, shade); box(5, 26, 13, 8, shade);
        box(-12, 5, 24, 23, "#fff8de"); box(-8, 11, 16, 13, "#fff");
        // Head, ears, cheeks
        box(-24, -33, 48, 37, gold); box(-23, -40, 13, 13, gold); box(10, -40, 13, 13, gold);
        box(-19, -36, 7, 6, "#f29b89"); box(12, -36, 7, 6, "#f29b89");
        box(-17, -25, 5, 7, "#392f30"); box(12, -25, 5, 7, "#392f30");
        box(-14, -11, 4, 3, "#ef9588"); box(10, -11, 4, 3, "#ef9588");
        box(-3, -15, 6, 4, "#b97359"); box(-1, -11, 2, 4, "#6a493c");
        // Halo
        box(-11, -52, 22, 3, "#e0b83d"); box(-8, -56, 16, 3, "#ffe891");
        // Arms / expression
        if (pose === "strain") {
          box(-29, -5, 9, 17, gold); box(20, -5, 9, 17, gold);
          box(-31, -8, 7, 7, "#fff1d2"); box(24, -8, 7, 7, "#fff1d2");
          box(-15, -24, 4, 8, "#392f30"); box(11, -24, 4, 8, "#392f30");
        } else if (pose === "dance") {
          box(-34, -18, 11, 7, gold); box(23, -18, 11, 7, gold);
          box(-37, -22, 8, 8, "#fff1d2"); box(29, -22, 8, 8, "#fff1d2");
        } else {
          box(-27, 2, 8, 15, gold); box(19, 2, 8, 15, gold);
          box(-26, 14, 7, 5, "#fff1d2"); box(20, 14, 7, 5, "#fff1d2");
        }
        if (tired) {
          box(-27, -30, 11, 3, "#7498c7"); box(15, -30, 11, 3, "#7498c7");
          pixelText("z", 30, -42, 8, "#6d9cd6");
        }
        ctx.restore();
      }
      function background(color = "#fff0b5") {
        box(0, 0, W, H, color);
        box(0, 260, W, 40, "#f6d98b");
        for (let x = 10; x < W; x += 32) for (let y = 12; y < 250; y += 28) {
          if ((x + y) % 4 === 0) sparkle(x, y, "#fff8d5", x * .2 + y);
        }
      }
      function drawTitle(now) {
        background("#fff0b5");
        pixelText("A TINY ANGEL CAT ADVENTURE", 240, 32, 9, "#a4793c");
        pixelText("Poo Poo Cat", 240, 69, 31, "#a96716", "center", "#fff");
        // Repeating outward cat parade
        for (let i = -2; i <= 2; i++) {
          const center = i === 0, phase = now / 180 + i;
          cat(240 + i * 78, 160, center ? 1 : .58, false, "dance");
          if (center) {
            const poopY = 108 + (Math.sin(phase) > .3 ? 0 : 7);
            box(232, poopY, 16, 6, "#70452f"); box(236, poopY - 5, 11, 6, "#70452f"); box(241, poopY - 9, 5, 5, "#70452f");
            box(242, poopY - 12, 3, 3, "#9a6a47");
          }
        }
        for (let i = 0; i < 8; i++) sparkle(31 + i * 60, 104 + Math.sin(now / 250 + i) * 10, "#fff", now / 240 + i);
        button(buttons.start, "Start!");
        pixelText("SPACE OR CLICK TO BEGIN", 240, 292, 8, "#8d693f");
      }
      function foodIcon(kind, x, y, scale = 1) {
        ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
        if (kind === "rice") {
          box(-15, 1, 30, 13, "#76a6bb"); box(-13, -2, 26, 10, "#fff"); box(-10, -6, 20, 8, "#fff8e4"); box(-4, -10, 12, 6, "#fff");
        } else if (kind === "corn") {
          box(-8, -13, 16, 29, "#f8cd4d", "#d3972d");
          for (let yy = -9; yy < 12; yy += 6) for (let xx = -4; xx < 6; xx += 6) box(xx, yy, 3, 3, "#fff18a");
          box(-13, 5, 7, 13, "#6a9c51"); box(6, 5, 7, 13, "#6a9c51");
        } else if (kind === "beet") {
          box(-12, -8, 24, 22, "#bd3653"); box(-8, -13, 16, 8, "#db5265"); box(-2, 12, 4, 7, "#628c4a"); box(-8, -14, 7, 6, "#7ca85a"); box(2, -15, 7, 7, "#7ca85a");
        } else {
          box(-16, -11, 32, 22, "#ed8794"); box(-12, -15, 24, 8, "#ffdce0"); box(-11, 10, 22, 6, "#8e594c");
          for (const [sx, sy] of [[-8,-4],[2,-6],[8,2],[-2,5],[5,-1]]) box(sx, sy, 2, 2, "#34313a");
        }
        ctx.restore();
      }
      function drawFood(now) {
        background("#fff0b5");
        box(0, 0, W, 40, "#f9df98");
        pixelText("Food for Poop", 240, 23, 18, "#93531c");
        const fade = Math.max(0, 1 - (now - sceneStartedAt) / 1800);
        if (fade > 0) {
          ctx.globalAlpha = fade;
          pixelText("Food for Poop", 240, 120, 23, "#a96716", "center", "#fff");
          pixelText("Decorate your Poop", 92 + ((Math.sin(now / 1700) + 1) * 90), 88, 10, "#ab8b57");
          ctx.globalAlpha = 1;
        }
        // Table and seated angel cat
        box(0, 176, W, 17, "#b77e4c"); box(0, 193, W, 8, "#8b5a36"); box(34, 201, 15, 65, "#b77e4c"); box(430, 201, 15, 65, "#b77e4c");
        box(171, 101, 138, 82, "#b78455"); box(177, 108, 126, 67, "#dfb67c"); cat(240, 131, .85, false, "sit");
        foodIcon("rice", 240, 181, .95);
        pixelText("Easy Mode", 240, 158, 9, "#6b542b");
        const cards = [
          { key: "corn", x: 48, en: "CORN", zh: "Sweet corn" },
          { key: "beet", x: 160, en: "BEETROOT", zh: "Beetroot" },
          { key: "dragon", x: 272, en: "DRAGON FRUIT", zh: "Dragon fruit" }
        ];
        cards.forEach((card, index) => {
          box(card.x, 206, 93, 67, "#ffedb9", "#d7a45e");
          foodIcon(card.key, card.x + 46, 224, .72);
          pixelText(card.key === "corn" ? "Hard Mode" : card.key === "beet" ? "Normal Mode" : "Expert Mode", card.x + 46, 245, 7, "#61472d");
          pixelText(card.en, card.x + 46, 256, 7, "#965d31");
          pixelText(card.zh, card.x + 46, 266, 7, "#8b6849");
        });
        box(383, 206, 83, 67, "#ffedb9", "#d7a45e");
        pixelText("CHOOSE A", 424, 225, 7, "#965d31"); pixelText("TREAT!", 424, 237, 9, "#965d31");
        pixelText("CLICK A DISH", 424, 258, 7, "#8b6849");
      }
      function tilePattern() {
        box(0, 0, W, H, "#dceef2");
        for (let y = 0; y < 260; y += 32) for (let x = 0; x < W; x += 48) {
          box(x, y, 46, 30, "#f9ffff", "#c5e0e8");
          box(x + 2, y + 2, 42, 26, "#fff");
        }
        box(0, 260, W, 40, "#b8d8e2");
        for (let x = 0; x < W; x += 48) box(x, 260, 46, 38, "#c8e3e9", "#a9cdd7");
      }
      function drawBathroom(now, intro = false) {
        tilePattern();
        // Tub and green curtain
        box(19, 173, 104, 51, "#faffff", "#9fc7d2"); box(26, 180, 90, 36, "#addce8"); box(18, 166, 108, 12, "#fff", "#9fc7d2");
        box(22, 132, 98, 9, "#5e9d72"); box(22, 141, 98, 28, "#70ad7e");
        for (let x = 30; x < 113; x += 16) box(x, 141, 4, 26, "#83bc88");
        // Sink and mirror
        box(364, 56, 75, 58, "#a9d8e3", "#9bc5ce"); box(369, 61, 65, 48, "#efffff");
        sparkle(384, 74, "#fff", now / 300); sparkle(421, 93, "#fff", now / 300 + 2);
        box(369, 139, 60, 19, "#fff", "#91bfc9"); box(374, 157, 50, 45, "#fbffff", "#91bfc9"); box(386, 133, 24, 5, "#a9d8e3");
        // Target poster
        box(181, 24, 118, 47, "#fff", "#bfdae0");
        pixelText("POOP TARGET", 240, 38, 8, "#627a81"); pixelText("0.3 kg", 240, 55, 17, "#db5265");
        // Toilet
        box(170, 190, 140, 13, "#fff", "#9cbfc8"); box(181, 202, 118, 48, "#fff", "#9cbfc8"); box(194, 242, 92, 12, "#d9e8e9");
        box(188, 184, 106, 18, "#e9f9fb", "#9cbfc8"); box(197, 187, 88, 10, "#70bbd1");
        for (let i = 0; i < 8; i++) sparkle(184 + ((i * 43) % 112), 189 + ((i * 17) % 53), "#fff", now / 140 + i);
        // Little cat and sign
        cat(239, 156, .72, false, "strain");
        box(203, 140, 74, 15, "#a36d3d", "#704b2d");
        pixelText(intro ? "Pooping Time!" : "READY?", 240, 147, 8, "#fff8da");
        for (let i = 0; i < 12; i++) sparkle(13 + i * 39, 78 + (i % 3) * 48, "#fff5b3", now / 110 + i);
        if (intro) {
          box(0, 0, W, H, "#ffffff66");
          pixelText("GET READY!", 240, 277, 13, "#39788a", "center", "#fff");
        }
      }
      function drawPoop(kind, x, y, scale = 1, wobble = 0) {
        ctx.save(); ctx.translate(x, y + wobble); ctx.scale(scale, scale);
        if (kind === "classic") {
          box(-12, 8, 24, 8, "#68402c"); box(-9, 0, 18, 9, "#68402c"); box(-6, -7, 13, 8, "#68402c"); box(-3, -13, 8, 7, "#68402c"); box(0, -17, 3, 5, "#9a6a47");
        } else if (kind === "corn") {
          box(-14, 4, 28, 12, "#242127"); box(-10, -4, 21, 10, "#242127"); box(-5, -12, 12, 9, "#242127");
          [[-8,8],[1,6],[8,10],[-3,0],[6,-2]].forEach(([sx,sy]) => box(sx, sy, 4, 4, "#f5c839"));
        } else if (kind === "beet") {
          box(-15, 2, 29, 13, "#c53654"); box(-11, -4, 23, 9, "#e05268"); box(-4, -9, 12, 8, "#c53654"); box(-8, 7, 5, 3, "#f28a92");
        } else {
          box(-16, 2, 32, 14, "#f0d743"); box(-11, -4, 24, 9, "#ffed70"); box(-4, -8, 11, 7, "#f0d743");
          [[-9,6],[1,4],[8,9],[-3,-1],[7,-2]].forEach(([sx,sy]) => box(sx, sy, 2, 2, "#242127"));
        }
        ctx.restore();
      }
      function drawMeter() {
        const x = 414, y = 65, h = 168, w = 28;
        pixelText("PULL", x + w / 2, 50, 9, "#57433a");
        box(x - 5, y - 5, w + 10, h + 10, "#fff", "#785a48");
        // The red, green, and yellow zones follow the requested 3:1:2 ratio.
        box(x, y, w, h * .5, "#df6270"); box(x, y + h * .5, w, h / 6, "#5ea96b"); box(x, y + h * (2 / 3), w, h / 3, "#e5bb54");
        const target = 7 / 12;
        box(x - 7, y + h * (1 - target) - 2, w + 14, 4, "#f04c53");
        pixelText("0.3kg", x + w / 2, y + h * (1 - target) - 12, 7, "#ce3948");
        const markerY = y + h * (1 - progress);
        box(x - 5, markerY - 4, w + 10, 8, "#fff", "#795034");
        pixelText("▲", x - 11, markerY, 9, "#795034");
      }
      function drawPlay(now) {
        drawBathroom(now);
        box(0, 0, W, 35, "#fff9e6cc");
        pixelText("Pooping Time", 240, 19, 17, "#93531c");
        pixelText(`${food.name} · ${food.label}`, 240, 48, 8, "#69533b");
        // Toilet water and the food-specific poop emerging from the top center
        box(197, 189, 86, 8, "#8bd5e6");
        const rise = Math.min(1, progress * 2.8);
        drawPoop(food.kind, 240, 181 - rise * 50, 1.35, Math.sin(now / 120) * (pushing ? 2 : 1));
        drawMeter();
        pixelText(pushing ? "KEEP HOLDING!" : "HOLD, THEN RELEASE IN GREEN", 226, 231, 7, "#584638");
        button(buttons.push, pushing ? "PUSHING..." : "Push!", pushing);
        pixelText("A pause over 1 second ends the run!", 226, 294, 7, "#765a44");
      }
      function drawSuccess(now) {
        background("#fff2b0");
        for (let i = 0; i < 18; i++) sparkle(12 + i * 27, 20 + ((i * 39) % 228), "#fff", now / 80 + i);
        cat(116, 179, .75, false, "dance"); cat(364, 179, .75, false, "dance");
        pixelText("✦  POP!  ✦", 116, 118, 9, "#db8b44"); pixelText("✦  POP!  ✦", 364, 118, 9, "#db8b44");
        drawPoop(food.kind, 240, 138, 2.5, Math.sin(now / 100) * 2);
        pixelText("Congratulations!", 240, 199, 21, "#a96716", "center", "#fff");
        pixelText("Perfect aim! The target is yours!", 240, 223, 9, "#6c543d");
        button(buttons.restart, "Restart!");
      }
      function drawFail(now) {
        background("#dfeeff");
        box(0, 0, W, 250, "#e8f4ff");
        for (let i = 0; i < 7; i++) pixelText("〰", 70 + i * 57, 55 + Math.sin(now / 250 + i) * 9, 17, "#80a8da");
        cat(240, 168, 1.25, true, "sit");
        pixelText("OOPS!", 240, 224, 11, "#6792c5");
        pixelText("Fail", 240, 253, 23, "#6587b0", "center", "#fff");
        pixelText(progress < .48 ? "Not quite enough!" : "Too much oomph!", 240, 276, 9, "#6783a2");
        button(buttons.restart, "Restart!");
      }
      function updateHint() {
        if (scene === "title") hint.innerHTML = "<strong>Click Start</strong> or press <strong>Space</strong> · Choose a food · Hold <strong>Push!</strong> and release in the green zone";
        else if (scene === "food") hint.innerHTML = "Pick a dish to feed your angel cat. Each food changes your challenge!";
        else if (scene === "play") hint.innerHTML = "Hold the button or Spacebar, then release when the marker reaches the green <strong>0.3 kg</strong> target.";
        else if (scene === "result") hint.innerHTML = result === "success" ? "A sparkling success! Click Restart or press Space to play again." : "Try another food and find your rhythm. Click Restart or press Space.";
      }
      function finish(success) {
        if (scene !== "play") return;
        pushing = false; result = success ? "success" : "fail"; scene = "result"; sceneStartedAt = performance.now();
        sound("flush"); updateHint();
      }
      function startPush() {
        if (scene !== "play" || pushing || pushExpired) return;
        if (lastPushAt && performance.now() - lastPushAt > 1000) { pushExpired = true; finish(false); return; }
        pushing = true; pushStartedAt = performance.now(); sound("tap");
      }
      function stopPush() {
        if (scene !== "play" || !pushing) return;
        const now = performance.now();
        pushAccumulated += now - pushStartedAt;
        progress = Math.min(1, pushAccumulated / 1000 / food.time * (7 / 12));
        pushing = false; lastPushAt = now;
        if (progress >= .5 && progress <= 2 / 3) finish(true);
        else if (progress > 2 / 3) finish(false);
      }
      function beginFood(key) {
        food = foodModes[key]; scene = "transition"; sceneStartedAt = performance.now(); progress = 0; pushAccumulated = 0; lastPushAt = 0; pushExpired = false;
        sound("tap"); updateHint();
        window.setTimeout(() => {
          if (scene === "transition") { scene = "play"; sceneStartedAt = performance.now(); updateHint(); }
        }, 1550);
      }
      function restart() {
        scene = "title"; progress = 0; pushAccumulated = 0; pushing = false; lastPushAt = 0; pushExpired = false; result = ""; sceneStartedAt = performance.now(); updateHint();
      }
      function point(event) {
        const rect = canvas.getBoundingClientRect();
        return { x: (event.clientX - rect.left) * W / rect.width, y: (event.clientY - rect.top) * H / rect.height };
      }
      function inside(p, r) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
      canvas.addEventListener("pointerdown", event => {
        const p = point(event); canvas.setPointerCapture(event.pointerId);
        if (scene === "title" && inside(p, buttons.start)) { scene = "food"; sceneStartedAt = performance.now(); sound("tap"); updateHint(); }
        else if (scene === "food") {
          if (p.y >= 206 && p.y <= 276) {
            if (p.x >= 48 && p.x < 141) beginFood("corn");
            else if (p.x >= 160 && p.x < 253) beginFood("beet");
            else if (p.x >= 272 && p.x < 365) beginFood("dragon");
          } else if (p.x >= 202 && p.x <= 278 && p.y >= 157 && p.y <= 200) beginFood("rice");
        } else if (scene === "play" && inside(p, buttons.push)) startPush();
        else if (scene === "result" && inside(p, buttons.restart)) restart();
      });
      canvas.addEventListener("pointerup", stopPush);
      canvas.addEventListener("pointercancel", stopPush);
      window.addEventListener("keydown", event => {
        if (event.code !== "Space" || event.repeat) return;
        event.preventDefault();
        if (scene === "title") { scene = "food"; sceneStartedAt = performance.now(); sound("tap"); updateHint(); }
        else if (scene === "play") startPush();
        else if (scene === "result") restart();
      });
      window.addEventListener("keyup", event => { if (event.code === "Space") stopPush(); });

      function frame(now) {
        if (scene === "play") {
          if (pushing) {
            const seconds = (pushAccumulated + now - pushStartedAt) / 1000;
            progress = Math.min(1, seconds / food.time * (7 / 12));
          } else if (lastPushAt && now - lastPushAt > 1000) {
            pushExpired = true; finish(false);
          }
        }
        if (scene === "title") drawTitle(now);
        else if (scene === "food") drawFood(now);
        else if (scene === "transition") drawBathroom(now, true);
        else if (scene === "play") drawPlay(now);
        else if (scene === "result") result === "success" ? drawSuccess(now) : drawFail(now);
        lastFrame = now; requestAnimationFrame(frame);
      }
      updateHint(); requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
